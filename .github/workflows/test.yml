name: Chess tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ['17', '21', '25']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Unit tests and independent chess oracle
        run: ./build.sh test
      - name: Desktop integration tests
        run: xvfb-run -a ./build.sh test-ui
